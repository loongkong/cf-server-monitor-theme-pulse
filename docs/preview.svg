<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="cardTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e6e9ee; }
      .d { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8b94a3; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #e6e9ee; }
      .md { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8b94a3; }
      .ok { fill: #34d399; }
      .warn { fill: #fbbf24; }
      .ac { fill: #2dd4bf; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="630" fill="#0d1117"/>

  <!-- 顶栏 -->
  <rect x="0" y="0" width="1200" height="64" fill="#11161d"/>
  <rect x="0" y="63" width="1200" height="1" fill="#232c39"/>
  <circle cx="52" cy="32" r="7" fill="#2dd4bf"/>
  <text x="70" y="39" class="t" font-size="24" font-weight="700">Pulse</text>
  <text x="140" y="39" class="d" font-size="14">Cloudflare Server Monitor</text>
  <rect x="1010" y="20" width="150" height="24" rx="12" fill="#1c2330" stroke="#2a3340"/>
  <circle cx="1028" cy="32" r="4" class="ok"/>
  <text x="1042" y="37" class="d" font-size="12">WebSocket 已连接</text>

  <!-- 统计卡 -->
  <g>
    <rect x="40" y="88" width="268" height="92" rx="12" fill="#161b22" stroke="#2a3340"/>
    <rect x="52" y="88" width="244" height="2" rx="1" fill="url(#cardTop)"/>
    <text x="58" y="116" class="d" font-size="12">在线</text>
    <text x="58" y="152" class="m" font-size="26" font-weight="650">8<tspan class="md" font-size="14" font-weight="400"> / 8</tspan></text>

    <rect x="324" y="88" width="268" height="92" rx="12" fill="#161b22" stroke="#2a3340"/>
    <rect x="336" y="88" width="244" height="2" rx="1" fill="url(#cardTop)"/>
    <text x="342" y="116" class="d" font-size="12">下行</text>
    <text x="342" y="152" class="m" font-size="26" font-weight="650">124.8 KB/s<tspan class="md" font-size="13" font-weight="400">  共 1.2 TB</tspan></text>

    <rect x="608" y="88" width="268" height="92" rx="12" fill="#161b22" stroke="#2a3340"/>
    <rect x="620" y="88" width="244" height="2" rx="1" fill="url(#cardTop)"/>
    <text x="626" y="116" class="d" font-size="12">上行</text>
    <text x="626" y="152" class="m" font-size="26" font-weight="650">173.4 KB/s<tspan class="md" font-size="13" font-weight="400">  共 356 GB</tspan></text>

    <rect x="892" y="88" width="268" height="92" rx="12" fill="#161b22" stroke="#2a3340"/>
    <rect x="904" y="88" width="244" height="2" rx="1" fill="url(#cardTop)"/>
    <text x="910" y="116" class="d" font-size="12">价值</text>
    <text x="910" y="152" class="m" font-size="26" font-weight="650">¥320<tspan class="md" font-size="14" font-weight="400"> / ¥960</tspan></text>
  </g>

  <!-- 服务器卡片 1 -->
  <g>
    <rect x="40" y="204" width="360" height="386" rx="12" fill="#161b22" stroke="#2a3340"/>
    <rect x="52" y="204" width="336" height="2" rx="1" fill="url(#cardTop)"/>
    <circle cx="64" cy="234" r="4.5" class="ok"/>
    <text x="78" y="240" class="t" font-size="16" font-weight="650">HK-01</text>
    <g>
      <rect x="52" y="252" width="52" height="19" rx="9.5" fill="#1c2330" stroke="#2a3340"/>
      <text x="64" y="265" class="d" font-size="11">🇭🇰 HK</text>
      <rect x="110" y="252" width="72" height="19" rx="9.5" fill="#1c2330" stroke="#2a3340"/>
      <text x="120" y="265" class="ac" font-size="11">Debian 12</text>
      <rect x="188" y="252" width="44" height="19" rx="9.5" fill="#1c2330" stroke="#2a3340"/>
      <text x="198" y="265" class="ac" font-size="11">IPv4</text>
      <rect x="238" y="252" width="86" height="19" rx="9.5" fill="#1c2330" stroke="#2a3340"/>
      <text x="248" y="265" class="ac" font-size="11">¥30/月</text>
    </g>
    <!-- meters -->
    <text x="58" y="300" class="d" font-size="11">CPU</text>
    <text x="382" y="300" class="m" font-size="12" text-anchor="end">42.3%</text>
    <rect x="58" y="306" width="324" height="7" rx="3.5" fill="#232c39"/>
    <rect x="58" y="306" width="137" height="7" rx="3.5" fill="url(#accentBar)"/>
    <text x="58" y="336" class="d" font-size="11">内存</text>
    <text x="382" y="336" class="m" font-size="12" text-anchor="end">3.7 GB / 8.0 GB</text>
    <rect x="58" y="342" width="324" height="7" rx="3.5" fill="#232c39"/>
    <rect x="58" y="342" width="150" height="7" rx="3.5" fill="url(#accentBar)"/>
    <text x="58" y="372" class="d" font-size="11">磁盘</text>
    <text x="382" y="372" class="m" font-size="12" text-anchor="end">31%</text>
    <rect x="58" y="378" width="324" height="7" rx="3.5" fill="#232c39"/>
    <rect x="58" y="378" width="100" height="7" rx="3.5" fill="url(#accentBar)"/>
    <!-- info rows -->
    <line x1="52" y1="400" x2="388" y2="400" stroke="#232c39"/>
    <text x="58" y="422" class="d" font-size="11">负载</text>
    <text x="96" y="422" class="m" font-size="12.5"><tspan class="ok">0.45</tspan><tspan dx="10" class="ok">0.32</tspan><tspan dx="10" class="warn">0.81</tspan></text>
    <text x="58" y="446" class="d" font-size="11">网络</text>
    <text x="96" y="446" class="m" font-size="12.5">↓ 1.2 MB/s   ↑ 856 KB/s</text>
    <text x="58" y="470" class="d" font-size="11">流量</text>
    <text x="96" y="470" class="m" font-size="12.5">↓ 985 GB   ↑ 123 GB</text>
    <!-- ping -->
    <line x1="52" y1="486" x2="388" y2="486" stroke="#232c39"/>
    <text x="58" y="508" class="d" font-size="11">电信 <tspan class="m ok" font-size="12">45ms</tspan></text>
    <text x="130" y="508" class="d" font-size="11">联通 <tspan class="m ok" font-size="12">30ms</tspan></text>
    <text x="202" y="508" class="d" font-size="11">移动 <tspan class="m warn" font-size="12">86ms</tspan></text>
    <text x="274" y="508" class="d" font-size="11">BGP <tspan class="m ok" font-size="12">52ms</tspan></text>
    <!-- bottom -->
    <text x="58" y="562" class="md" font-size="10">在线 12天</text>
    <text x="170" y="562" class="md" font-size="10">上报 12:00:05</text>
    <text x="382" y="562" class="md" font-size="10" text-anchor="end">采集 12:00:05(+3s)</text>
  </g>

  <!-- 服务器卡片 2 -->
  <g>
    <rect x="420" y="204" width="360" height="386" rx="12" fill="#161b22" stroke="#2a3340"/>
    <rect x="432" y="204" width="336" height="2" rx="1" fill="url(#cardTop)"/>
    <circle cx="444" cy="234" r="4.5" class="ok"/>
    <text x="458" y="240" class="t" font-size="16" font-weight="650">JP-02</text>
    <rect x="432" y="252" width="46" height="19" rx="9.5" fill="#1c2330" stroke="#2a3340"/>
    <text x="443" y="265" class="d" font-size="11">🇯🇵 JP</text>
    <rect x="484" y="252" width="66" height="19" rx="9.5" fill="#1c2330" stroke="#2a3340"/>
    <text x="494" y="265" class="ac" font-size="11">CentOS 7</text>
    <rect x="556" y="252" width="76" height="19" rx="9.5" fill="#1c2330" stroke="#2a3340"/>
    <text x="566" y="265" class="ac" font-size="11">↑↓ 1T(95%)</text>
    <text x="438" y="300" class="d" font-size="11">CPU</text>
    <text x="762" y="300" class="m" font-size="12" text-anchor="end">12.8%</text>
    <rect x="438" y="306" width="324" height="7" rx="3.5" fill="#232c39"/>
    <rect x="438" y="306" width="41" height="7" rx="3.5" fill="url(#accentBar)"/>
    <text x="438" y="336" class="d" font-size="11">内存</text>
    <text x="762" y="336" class="m" font-size="12" text-anchor="end">1.2 GB / 2.0 GB</text>
    <rect x="438" y="342" width="324" height="7" rx="3.5" fill="#232c39"/>
    <rect x="438" y="342" width="194" height="7" rx="3.5" fill="url(#accentBar)"/>
    <text x="438" y="372" class="d" font-size="11">磁盘</text>
    <text x="762" y="372" class="m" font-size="12" text-anchor="end">58%</text>
    <rect x="438" y="378" width="324" height="7" rx="3.5" fill="#232c39"/>
    <rect x="438" y="378" width="188" height="7" rx="3.5" fill="url(#accentBar)"/>
    <line x1="432" y1="400" x2="768" y2="400" stroke="#232c39"/>
    <text x="438" y="422" class="d" font-size="11">负载</text>
    <text x="476" y="422" class="m" font-size="12.5"><tspan class="ok">0.08</tspan><tspan dx="10" class="ok">0.11</tspan><tspan dx="10" class="ok">0.06</tspan></text>
    <text x="438" y="446" class="d" font-size="11">网络</text>
    <text x="476" y="446" class="m" font-size="12.5">↓ 66 KB/s   ↑ 12 KB/s</text>
    <text x="438" y="470" class="d" font-size="11">流量</text>
    <text x="476" y="470" class="m" font-size="12.5">↓ 50 GB   ↑ 8 GB</text>
    <line x1="432" y1="486" x2="768" y2="486" stroke="#232c39"/>
    <text x="438" y="508" class="d" font-size="11">电信 <tspan class="m ok" font-size="12">62ms</tspan></text>
    <text x="510" y="508" class="d" font-size="11">联通 <tspan class="m ok" font-size="12">58ms</tspan></text>
    <text x="582" y="508" class="d" font-size="11">移动 <tspan class="m ok" font-size="12">71ms</tspan></text>
    <text x="438" y="562" class="md" font-size="10">在线 35天</text>
    <text x="550" y="562" class="md" font-size="10">上报 12:00:04</text>
    <text x="762" y="562" class="md" font-size="10" text-anchor="end">采集 12:00:04(+1s)</text>
  </g>

  <!-- 服务器卡片 3（离线） -->
  <g opacity="0.62">
    <rect x="800" y="204" width="360" height="386" rx="12" fill="#161b22" stroke="#2a3340"/>
    <rect x="812" y="204" width="336" height="2" rx="1" fill="url(#cardTop)"/>
    <circle cx="824" cy="234" r="4.5" fill="#f87171"/>
    <text x="838" y="240" class="t" font-size="16" font-weight="650">US-03</text>
    <text x="1148" y="228" class="d" font-size="11" text-anchor="end">3天前</text>
    <rect x="812" y="252" width="46" height="19" rx="9.5" fill="#1c2330" stroke="#2a3340"/>
    <text x="823" y="265" class="d" font-size="11">🇺🇸 US</text>
    <rect x="864" y="252" width="72" height="19" rx="9.5" fill="#1c2330" stroke="#2a3340"/>
    <text x="874" y="265" class="ac" font-size="11">Ubuntu 24</text>
    <text x="818" y="300" class="d" font-size="11">CPU</text>
    <text x="1142" y="300" class="m" font-size="12" text-anchor="end">—</text>
    <rect x="818" y="306" width="324" height="7" rx="3.5" fill="#232c39"/>
    <text x="818" y="336" class="d" font-size="11">内存</text>
    <text x="1142" y="336" class="m" font-size="12" text-anchor="end">—</text>
    <rect x="818" y="342" width="324" height="7" rx="3.5" fill="#232c39"/>
    <text x="818" y="372" class="d" font-size="11">磁盘</text>
    <text x="1142" y="372" class="m" font-size="12" text-anchor="end">—</text>
    <rect x="818" y="378" width="324" height="7" rx="3.5" fill="#232c39"/>
    <line x1="812" y1="400" x2="1148" y2="400" stroke="#232c39"/>
    <text x="818" y="422" class="d" font-size="11">负载</text>
    <text x="856" y="422" class="md" font-size="12.5">—  —  —</text>
    <text x="818" y="446" class="d" font-size="11">网络</text>
    <text x="856" y="446" class="md" font-size="12.5">↓ —   ↑ —</text>
    <text x="818" y="470" class="d" font-size="11">流量</text>
    <text x="856" y="470" class="md" font-size="12.5">↓ 210 GB   ↑ 44 GB</text>
    <text x="818" y="562" class="md" font-size="10">离线 3天</text>
  </g>
</svg>
